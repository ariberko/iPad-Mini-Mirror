name: Simulate

# Runs Mirror on an iPhone and an iPad Simulator, takes screenshots and records
# the two devices mirroring each other. Results go to a `simulation/<run>` branch
# and to the run's artifacts.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['Mirror/**', 'Shared/**', 'Broadcast/**', 'scripts/simulate.sh', '.github/workflows/simulate.yml', 'project.yml']

permissions:
  contents: write

concurrency:
  group: simulate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run the simulation
        run: scripts/simulate.sh "$RUNNER_TEMP/simulation"

      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 6
        with:
          name: simulation
          path: ${{ runner.temp }}/simulation

      # Publishing (with smaller videos) happens in publish-simulation.yml.
